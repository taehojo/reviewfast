[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-screen"
version = "0.1.0"
description = "Title and abstract screening for systematic reviews, ranked by Jev and stopped by a statistical criterion"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Taeho Jo", email = "tjo@iu.edu" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "numpy>=1.24", "python-multipart>=0.0.9"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Medical Science Apps."]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
jev-screen = "jevscreen.cli:main"

[tool.setuptools]
packages = ["jevscreen"]

[tool.setuptools.package-data]
jevscreen = ["web/*"]
