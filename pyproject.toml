[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reviewfast"
version = "0.3.1"
description = "Title and abstract screening for systematic reviews: decision-model ranking with a statistical stopping criterion"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Taeho Jo", email = "tjo@iu.edu" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "numpy>=1.24", "python-multipart>=0.0.9"]
classifiers = ["Programming Language :: Python :: 3", "Intended Audience :: Science/Research", "Topic :: Scientific/Engineering :: Medical Science Apps."]

[project.optional-dependencies]
test = ["pytest>=8", "mcp>=1.2"]
mcp = ["mcp>=1.2"]

[project.scripts]
reviewfast = "reviewfast.cli:main"
reviewfast-mcp = "reviewfast.mcp_server:main"

[tool.setuptools]
packages = ["reviewfast"]

[tool.setuptools.package-data]
reviewfast = ["web/*"]
