name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install -e '.[test]'
      - run: node --check reviewfast/web/app.js && node --check site/app.js
      - run: node site/test/core.test.js
      - run: pytest -q
